services:

  yolo-api:
    image: ghcr.io/kaypes/yolo-edge-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro    # pesos somente-leitura
      - ./output:/app/output       # resultados gravados aqui
      - ./images:/app/images:ro    # imagens de teste
    environment:
      - MODEL_NAME=yolo-epi.pt
    networks:
      - yolo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  yolo-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: yolo-client
    volumes:
      - ./images:/client/images:ro
      - ./output:/client/output
    environment:
      - API_URL=http://yolo-api:8000   # resolve pelo nome do serviço
    networks:
      - yolo-net
    depends_on:
      yolo-api:
        condition: service_healthy     # aguarda healthcheck passar

  yolo-stream:
    image: ghcr.io/kaypes/yolo-edge-api:latest  # reaproveita a imagem já publicada pelo CI
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-stream
    ports:
      - "5000:5000"
    privileged: true                 # mesmo acesso à câmera do yolo-api
    volumes:
      - ./stream:/app/stream           # código do módulo de streaming
      - ./preprocessing:/app/preprocessing:ro  # módulo de pré-processamento
      - ./models:/app/models:ro        # pesos do modelo (read-only)
      - /dev:/dev                      # dispositivos de hardware do host
      - /run/udev:/run/udev:ro         # permite ao libcamera identificar o sensor via udev
    environment:
      - MODEL_NAME=yolo-epi.pt
    command: >
      python3 stream/mjpeg_server.py
      --device 0
      --model models/yolo-epi.pt
      --infer-every 3
      --infer-size 320
      --port 5000
    restart: unless-stopped
    depends_on:
      - yolo-api

networks:
  yolo-net:
    driver: bridge
